[project]
name = "dialz"
version = "1.1.4"
description = "The official repo for the Dialz Python library - a toolkit for steering vector research."
authors = [{name = "groovychoons", email = "siddiquezs2@cardiff.ac.uk"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.1",
    "transformers>=4.46.3",
    "accelerate>=1.1.1",
    "python-dotenv>=1.0.1",
    "gguf>=0.13.0",
    "scikit-learn>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "black>=24.10.0",
    "pre-commit>=4.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
